name: Deploy Angular Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'coyne/package-lock.json'

      - name: Install dependencies and build
        working-directory: ./coyne
        run: |
          npm ci
          npm run build -- --base-href /

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Angular 17+ outputs to dist/<project-name>/browser
          # Older Angular versions output to dist/<project-name>
          path: './coyne/dist/coyne'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
