<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Fun Stuff!</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <meta name="google-site-verification" content="YB0ab-PmliaxC-Zd7oAxyyJSRAsBF-903VDlOvG9Ww0" />
  <style>
    main {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
      background: #f9f9f9;
    }

    .image-grid {
        column-count: 3; 
        column-gap: 1rem;
        margin-top: 2rem;
    }

    .image-grid figure {
        display: inline-block;
        width: 100%;
        margin: 0 0 1rem;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 10px;
        box-sizing: border-box;
    }

    figure {
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 10px;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: auto; /* 🔑 let height adjust */
    }

    figure img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        margin-bottom: 0.5rem;
    }

    figcaption {
      font-size: 0.9rem;
      margin-top: 0.5rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container-fluid">
    <div class="row">
        <div class="col-md-2 p-0">
            <app-nav-buttons></app-nav-buttons>
          </div>
      <main class="col-md-10">
        <section>
                    <h1 class="display-4 text-primary typewriter">{{ typedText }}</h1>
          <p class="fs-5 text-start">
            To show a little extra personality, here's some random photos of fun stuff that's important to me!
          </p>
        </section>

        <div class="image-grid">
          <figure>
            <img src="assets/img/waffles.JPG" alt="waffles dog" />
            <figcaption>Waffles! She does actually like the sweater, I promise</figcaption>
          </figure>
          <figure>
            <img src="assets/img/sisters.JPG" alt="sisters" />
            <figcaption>My sisters! They're pretty cool, I guess 😉</figcaption>
          </figure>
          <figure>
            <img src="assets/img/friends1.jpg" alt="friends from college" />
            <figcaption>My roommates at UD and some of my best friends!</figcaption>
          </figure>
          <figure>
            <img src="assets/img/friends2.JPEG" alt="friends from high school" />
            <figcaption>Some of my best friends that I went to high school with!</figcaption>
          </figure>
          <figure>
            <img src="assets/img/joshy.JPG" alt="father" />
            <figcaption>My dad 💙</figcaption>
          </figure>
          <figure>
            <img src="assets/img/mommy.jpg" alt="mom" />
            <figcaption>My mom 💖</figcaption>
          </figure>
          <figure>
            <img src="assets/img/bowling.jpg" alt="bowling" />
            <figcaption>I grew up in bowling alleys 🎳 this was me at states in high school!</figcaption>
          </figure>
          <figure>
            <img src="assets/img/maine.JPG" alt="maine" />
            <figcaption>My family and I love hiking! This was in Acadia National Park</figcaption>
          </figure>
          <figure>
            <img src="assets/img/family.JPG" alt="family" />
            <figcaption>Hope you enjoyed getting to know me :)</figcaption>
          </figure>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/nav.js"></script>
</body>

</html>
