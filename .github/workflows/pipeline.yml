name: PR Build and Test Check

on:
  pull_request:
    branches:
      - main

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'coyne/package-lock.json'

      - name: Install dependencies and verify build
        working-directory: ./coyne
        run: |
          npm ci
          npm run build -- --configuration production --base-href /
